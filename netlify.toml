# One site serving all seven apps: the comparison harness at the root, and each
# of the six independently built apps under its own path prefix. The prefixes
# are decided in scripts/deploy-target.ts and laid out by
# scripts/assemble-dist.mjs; this file only has to agree with them.
#
#   /                  comparison harness
#   /option1/shell/    Option 1 Shell, with app1 and app2 beside it
#   /option2/shell/    Option 2 Shell, with app1 and app2 beside it
#
# Both Shells route on the URL hash, so every path above is a real file on disk
# and no SPA fallback rule is needed.

[build]
  command = "bun run build:netlify"
  publish = "dist"

[build.environment]
  # Bun is the package manager and the script runner; Node is still the runtime
  # that executes Vite, because its binary carries a Node shebang.
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"

# Shorter entrances to the two systems, for typing by hand.
[[redirects]]
  from = "/option1"
  to = "/option1/shell/"
  status = 302

[[redirects]]
  from = "/option2"
  to = "/option2/shell/"
  status = 302
